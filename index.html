<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>GaspoHub – Book Professional Photographers & Shop Prints</title>
    <meta name="description" content="GaspoHub connects clients with vetted professional photographers for weddings, events, and portraits. Browse portfolios, book sessions securely, and shop prints." />
    <meta name="author" content="GaspoHub" />
    <meta name="keywords" content="photography marketplace, book photographer, wedding photographer, event photography, portrait photographer, photo prints" />
    <link rel="canonical" href="https://gaspohub.lovable.app/" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ef4444" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GaspoHub" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="GaspoHub – Photography Marketplace" />
    <meta property="og:description" content="Find and book professional photographers for any occasion. Secure escrow payments, verified reviews." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gaspohub.lovable.app/" />
    <meta property="og:image" content="https://gaspohub.lovable.app/og-image.jpg" />
    <meta property="og:site_name" content="GaspoHub" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GaspoHub – Photography Marketplace" />
    <meta name="twitter:description" content="Find and book professional photographers for any occasion." />
    <meta name="twitter:image" content="https://gaspohub.lovable.app/og-image.jpg" />

    <!-- JSON-LD: Organization & WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "GaspoHub",
          "url": "https://gaspohub.lovable.app/",
          "logo": "https://gaspohub.lovable.app/pwa-192x192.png",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "GaspoHub",
          "url": "https://gaspohub.lovable.app/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://gaspohub.lovable.app/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
